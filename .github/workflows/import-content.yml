name: Import content
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: content-import
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run import:velog
      - run: npm run import:projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit imported content and deploy
        run: |
          if [ -n "$(git status --porcelain -- src/data/generated)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898133+github-actions[bot]@users.noreply.github.com'
            git add src/data/generated/
            git commit -m 'chore: 콘텐츠 동기화'
            git push
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
